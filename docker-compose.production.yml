# ==============================================================================
# TokenPool — Production Docker Compose Deployment
# Architecture: Nginx (TLS / Proxy) -> Gunicorn (Uvicorn Workers) -> External PostgreSQL
# ==============================================================================
version: "3.8"

services:
  # TokenPool Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tokenpool:production
    container_name: tokenpool_app
    restart: always
    env_file:
      - .env.production
    environment:
      - ENVIRONMENT=production
      - DEMO_MODE=false
    volumes:
      - uploads_data:/app/backend/app/uploads
    networks:
      - tokenpool_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Reverse Proxy Service (HTTPS Termination)
  nginx:
    image: nginx:1.25-alpine
    container_name: tokenpool_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/tokenpool.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_data:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - tokenpool_net

volumes:
  uploads_data:
    name: tokenpool_uploads_data
  certs_data:
    name: tokenpool_certs_data

networks:
  tokenpool_net:
    name: tokenpool_network
    driver: bridge
