<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  {% block head_extra %}{% endblock %}

<body>
{% block body %}

<!-- ── TOP BAR ── -->
<div class="top-bar">
  <div class="top-bar-logo">
    <div class="logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/></svg>
    </div>
    <span class="logo-text">TokenPool</span>
  </div>
  <div class="top-bar-bc">
    <span class="bc-item">{% block bc_parent %}Home{% endblock %}</span>
    <span class="bc-sep">/</span>
    <span class="bc-cur">{% block bc_page %}Dashboard{% endblock %}</span>
  </div>
  <div style="flex:1"></div>
  <div class="top-bar-right">
    <div class="icon-btn" onclick="window.location.href='/notifications'" title="Notifications">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/></svg>
      <span class="notif-dot" id="topBarNotifDot" style="display:none"></span>
    </div>
    <div class="avatar-btn" onclick="window.location.href='/settings'" data-user-initials>TP</div>
  </div>
</div>

<!-- ── LAYOUT ── -->
<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="ws-strip">
      <div class="ws-avatar" id="wsAvatarEl">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z"/></svg>
      </div>
      <div class="ws-info">
        <div class="ws-label" id="wsRoleLabel">User</div>
        <div class="ws-name" data-user-name>TokenPool User</div>
      </div>
    </div>

    <nav class="nav" id="sidebarNav">
      <!-- Rendered by JS based on user.role -->
      <div style="padding:20px 8px;text-align:center"><span class="spinner"></span></div>
    </nav>

    <div class="sidebar-foot">
      <div class="user-row">
        <div class="user-av" data-user-initials>TP</div>
        <div class="user-info">
          <div class="user-name" data-user-name>TokenPool User</div>
          <div class="user-email" data-user-email>user@tokenpool.ai</div>
        </div>
        <div class="user-more" onclick="doLogout()" title="Logout">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="13" height="13"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15"/></svg>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main" id="mainContent">
    {% block content %}{% endblock %}
  </main>
</div>

{% endblock %}

<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/utils.js"></script>

// ─── Init sidebar ─────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  if (!requireAuth()) return;

  const user = getUser();
  applyUser();

  // Build sidebar based on role
  const nav = document.getElementById("sidebarNav");
  const wsRole = document.getElementById("wsRoleLabel");
  const isAdmin = user && user.role === "ADMIN";

  if (isAdmin) {
    nav.innerHTML = ADMIN_NAV;
    if (wsRole) wsRole.textContent = "Administrator";
    const wsAv = document.getElementById("wsAvatarEl");
    if (wsAv) wsAv.style.background = "#7c3aed";
  } else {
    nav.innerHTML = USER_NAV;
    if (wsRole) wsRole.textContent = "Member";
  }

  // Mark active link
  nav.querySelectorAll("a[data-page]").forEach(a => {
    if (a.dataset.page === ACTIVE_PAGE) a.classList.add("active");
  });

  // Fetch unread notification count from API
  NotifAPI.list().then(d => {
    const items = d?.data || d?.notifications || [];
    const unread = items.filter ? items.filter(n => !n.is_read).length : (d?.unread_count || 0);
    if (unread > 0) {
      const badge = document.getElementById("notifCount");
      if (badge) { badge.textContent = unread; badge.style.display = "inline-flex"; }
      const dot = document.getElementById("topBarNotifDot");
      if (dot) dot.style.display = "block";
    }
  }).catch(() => {});
});

function doLogout()        { clearSession(); window.location.href = "/login"; }
function toggleNotifPanel(){ window.location.href = "/notifications"; }
function toggleUserMenu()  { window.location.href = "/settings"; }
</script>
